name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  static-analysis-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Security Audit (Frontend)
        run: npm audit --audit-level=high

      - name: Security Audit (Backend)
        run: |
          cd server
          npm audit --audit-level=high

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [static-analysis-and-security]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Run Supertest & MongoMemoryServer Suites
        run: |
          cd server
          npm ci
          npx vitest run --config vitest.config.cjs

  frontend-unit-tests:
    name: Frontend Component & Unit Tests
    runs-on: ubuntu-latest
    needs: [static-analysis-and-security]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Frontend Suite
        run: npx vitest run

  frontend-build-verification:
    name: Frontend Production Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-integration-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Production Bundle
        env:
          VITE_API_BASE_URL: https://ar-portfolio-api.onrender.com
        run: npm run build
